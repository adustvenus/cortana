# Builds the Cortana Mobile APK whenever the app changes.
#
# Release flow (main branch): build -> commit the signed APK + version.json to
# mobile/dist/ -> tag a GitHub release (mobile-v<version>). The workstation
# picks up mobile/dist on its next `git pull`, the bridge serves it, and every
# paired phone gets the "update available" pop-up. To ship an update: bump
# versionCode + versionName in mobile/app/build.gradle and push to main.
#
# Signing needs TWO repo secrets - the keystore is never committed:
#   CORTANA_KEYSTORE_B64   base64 of mobile/keystore/cortana-release.p12
#   CORTANA_KEYSTORE_PASS  its password
# Every build must use the SAME keystore - Android refuses to install an update
# signed differently. Rotating it means users reinstall the app.
name: mobile-apk

on:
  push:
    paths:
      - 'mobile/**'
      - '.github/workflows/mobile-apk.yml'
      - '!mobile/dist/**'      # our own release commit must not re-trigger us
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mobile-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Restore signing keystore
        env:
          KEYSTORE_B64: ${{ secrets.CORTANA_KEYSTORE_B64 }}
          KEYSTORE_PASS: ${{ secrets.CORTANA_KEYSTORE_PASS }}
        run: |
          # Each failure below is reported distinctly: a missing secret, a
          # mistyped name and a wrong password all look identical otherwise,
          # and the logs are unreadable without repo admin.
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::error::CORTANA_KEYSTORE_B64 is empty or not set. The name must match EXACTLY, and it must be a REPOSITORY secret under Settings > Secrets and variables > Actions > the Secrets tab - not the Variables tab, and not an Environment secret (this job declares no environment, so it cannot see those)."
            exit 1
          fi
          if [ -z "$KEYSTORE_PASS" ]; then
            echo "::error::CORTANA_KEYSTORE_PASS is empty or not set - same checks as above."
            exit 1
          fi
          echo "base64 secret length: ${#KEYSTORE_B64} chars (expected 5752)"
          mkdir -p mobile/keystore
          # tr tolerates a pasted value that picked up newlines or wrapping.
          if ! printf '%s' "$KEYSTORE_B64" | tr -d '[:space:]'                | base64 -d > mobile/keystore/cortana-release.p12 2>/tmp/b64.err; then
            echo "::error::CORTANA_KEYSTORE_B64 is not valid base64: $(cat /tmp/b64.err)"
            exit 1
          fi
          size=$(stat -c%s mobile/keystore/cortana-release.p12)
          echo "decoded keystore: $size bytes (expected 4314)"
          if [ "$size" -lt 1000 ]; then
            echo "::error::decoded keystore is only $size bytes - the secret looks truncated."
            exit 1
          fi
          # Proves BOTH secrets in one shot: a wrong password fails here rather
          # than deep inside Gradle with an opaque signing error.
          if ! keytool -list -keystore mobile/keystore/cortana-release.p12                -storetype PKCS12 -storepass "$KEYSTORE_PASS" >/dev/null 2>&1; then
            echo "::error::The keystore decoded, but CORTANA_KEYSTORE_PASS did not open it. Re-copy the password with no trailing newline."
            exit 1
          fi
          echo "keystore restored and password verified"

      - name: Build signed release APK
        env:
          CORTANA_KEYSTORE_PASS: ${{ secrets.CORTANA_KEYSTORE_PASS }}
        run: |
          if [ -z "$CORTANA_KEYSTORE_PASS" ]; then
            echo "::error::CORTANA_KEYSTORE_PASS is not set - the APK would be unsigned."
            exit 1
          fi
          gradle -p mobile assembleRelease --no-daemon

      - name: Shred the keystore
        if: always()
        run: rm -f mobile/keystore/cortana-release.p12

      - name: Read app version
        id: ver
        run: |
          V=$(grep -oP 'versionName\s+"\K[0-9.]+' mobile/app/build.gradle)
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "Built version $V"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: cortana-mobile-v${{ steps.ver.outputs.version }}
          path: mobile/app/build/outputs/apk/release/app-release.apk

      # ── main branch only: publish to mobile/dist + a GitHub release ──
      - name: Commit APK to mobile/dist
        if: github.ref == 'refs/heads/main'
        run: |
          mkdir -p mobile/dist
          cp mobile/app/build/outputs/apk/release/app-release.apk mobile/dist/cortana-mobile.apk
          cat > mobile/dist/version.json <<EOF
          {
            "version": "${{ steps.ver.outputs.version }}",
            "apk": "cortana-mobile.apk",
            "commit": "${GITHUB_SHA}",
            "builtAt": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          }
          EOF
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add mobile/dist
          if git diff --cached --quiet; then
            echo "dist unchanged"; exit 0
          fi
          git commit -m "mobile: publish APK v${{ steps.ver.outputs.version }} to dist"
          # A racing push to main between checkout and here: rebase and retry.
          for i in 1 2 3; do
            git push && break
            git pull --rebase && sleep 2
          done

      - name: Tag GitHub release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="mobile-v${{ steps.ver.outputs.version }}"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "release $TAG already exists - skipping (bump versionName to ship)"
            exit 0
          fi
          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --title "Cortana Mobile v${{ steps.ver.outputs.version }}" \
            --notes "Signed Android APK. Phones paired to the bridge get the update pop-up automatically once the workstation pulls this commit." \
            mobile/app/build/outputs/apk/release/app-release.apk#cortana-mobile-v${{ steps.ver.outputs.version }}.apk
