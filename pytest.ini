[pytest]
# mic_test.py is a hardware diagnostic you run by hand (it opens the mic), not a
# test - pytest's default *_test.py glob would collect it and fail at import on
# any machine without audio hardware. Restrict discovery to test_*.py.
python_files = test_*.py
testpaths = .
norecursedirs = Dashboard venv .venv cortana_venv __pycache__ node_modules
