plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.cortana.mobile'
    compileSdk 34

    defaultConfig {
        applicationId "com.cortana.mobile"
        minSdk 26
        targetSdk 34
        // Bump BOTH on every release: versionName is what the update prompt
        // compares; versionCode is what Android's installer compares. The CI
        // workflow reads versionName to tag the release and mobile/dist.
        versionCode 17
        versionName "2.2.1"
    }

    signingConfigs {
        release {
            // The keystore is a SECRET and is deliberately NOT committed. The
            // previous one was, together with its password, on a public repo -
            // anyone could sign an update this app would silently install. Both
            // have been rotated; the old key is dead.
            //
            // CI writes the keystore from the CORTANA_KEYSTORE_B64 repo secret.
            // For a local release build, put your copy at
            // mobile/keystore/cortana-release.p12 and export
            // CORTANA_KEYSTORE_PASS. Every build must use the SAME keystore -
            // Android refuses an update signed with a different key.
            def ksPass = System.getenv('CORTANA_KEYSTORE_PASS')
            def ks = file('../keystore/cortana-release.p12')
            if (ks.exists() && ksPass) {
                storeFile ks
                storeType 'PKCS12'
                storePassword ksPass
                keyAlias 'cortana'
                keyPassword ksPass
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            // Left unsigned when the keystore/password are absent (a fork, or a
            // debug-only checkout) instead of breaking every Gradle task. CI
            // asserts the secret is present before it builds.
            if (signingConfigs.release.storeFile != null) {
                signingConfig signingConfigs.release
            }
        }
    }

    buildFeatures {
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
    implementation 'androidx.security:security-crypto:1.1.0-alpha06'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
}
